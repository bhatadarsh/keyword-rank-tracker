services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusrank-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./rank_tracker.db
      - SERP_PROVIDER=free
      - SEARXNG_URL=
      - SERP_API_KEY=
    volumes:
      - backend-data:/app/exports/files
      - backend-db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusrank-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-db:
